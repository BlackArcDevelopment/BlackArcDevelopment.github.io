<title>BAD OS</title>
<style>
  /* ── Design tokens ──────────────────────────────────────────────
     Single committed visual world (void + arc glow) — intentionally
     not theme-adaptive; every color is painted explicitly so the
     page holds regardless of the viewer's OS theme. */

    --void:#050507;
    --void-vignette: rgba(0,0,0,.55);
    --panel: rgba(255,255,255,.045);

    --border-strong: rgba(255,255,255,.2);
    --glow:#eef3ff;
    --glow-soft: rgba(238,243,255,.35);
    --glow-faint: rgba(238,243,255,.09);
    --text:#f4f5f8;
    --text-dim:#9a9ca8;
    --radius-sm:8px;
    --radius-lg:14px;
    --ease: cubic-bezier(.22,.9,.28,1);
    --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }

  *{ box-sizing:border-box; }
  ::selection{ background:var(--glow-soft); color:#0a0a0d; }

    font-family:var(--font-body);
    color:var(--text);
    overflow:hidden;
  }

  /* soft vignette to keep the taskbar legible against the bright arc */
  .desktop::after{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% 0%, transparent 55%, rgba(0,0,0,.35) 100%),
      linear-gradient(to top, rgba(0,0,0,.55), transparent 22%);
    pointer-events:none;
  }

  .boot-mark{
    position:absolute; top:22px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:.55em;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    color:var(--text-dim); text-transform:uppercase;
    opacity:.55;
    animation: rise .6s var(--ease) both;
    pointer-events:none;
  }
  .boot-mark img{ width:14px; height:auto; filter:drop-shadow(0 0 4px var(--glow-soft)); }

  /* ── Taskbar ─────────────────────────────────────────────────── */
  .taskbar-wrap{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding: 0 16px calc(14px + env(safe-area-inset-bottom,0px));
    pointer-events:none;
  }

  .taskbar-glow{
    position:fixed; left:50%; bottom:0; width:min(720px,90vw); height:180px;
    transform:translateX(-50%);
    background: radial-gradient(closest-side, var(--glow-faint), transparent 72%);
    pointer-events:none;
  }

  .taskbar{
    position:relative;
    pointer-events:auto;
    width:min(880px, 100%);
    display:flex; align-items:center; gap:10px;
    padding:8px 10px;
    background: linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    animation: rise .55s .05s var(--ease) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* Start button */
  .start-btn{
    appearance:none; border:1px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; padding:0; flex:none; overflow:hidden;
    background:transparent; border-radius:var(--radius-sm);
    color:var(--text);
    transition: background .18s var(--ease), border-color .18s var(--ease), box-shadow .25s var(--ease);
  }
  .start-btn img{
    width:100%; height:100%; display:block; object-fit:contain;
    filter:drop-shadow(0 0 4px var(--glow-soft));
  }
  .start-btn:hover{
    background:var(--panel-strong);
    border-color:var(--border-strong);
    box-shadow:0 0 0 1px var(--border-strong), 0 0 18px -4px var(--glow-soft);
  }
  .start-btn:active{ transform:translateY(1px) scale(.99); }
  .start-btn:focus-visible{ outline:2px solid var(--glow-soft); outline-offset:2px; }

  .divider{ width:1px; align-self:stretch; margin:6px 2px; background:var(--border); }

  /* ── Start menu ─────────────────────────────────────────────── */
  .start-menu{
    position:absolute; left:10px; bottom:calc(100% + 12px);
    width:252px; max-width:calc(100vw - 20px); z-index:6;
    display:flex; gap:6px; padding:10px;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    transform-origin:bottom left;
    opacity:0; transform:translateY(8px) scale(.97);
    pointer-events:none;
    transition:opacity .16s var(--ease), transform .16s var(--ease);
  }
  .start-menu.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

  .sm-col{ display:flex; flex-direction:column; gap:2px; }
  .sm-col-main{ flex:1 1 auto; min-width:0; }

  .sm-item{
    appearance:none; border:0; cursor:pointer; width:100%;
    display:flex; align-items:center; gap:10px;
    padding:8px 9px; border-radius:var(--radius-sm);
    background:transparent; color:var(--text); font-family:var(--font-body); font-size:13px;
    text-align:left;
    transition:background .15s var(--ease);
  }
  .sm-item svg{ flex:none; width:17px; height:17px; color:var(--glow); }
  .sm-item:hover, .sm-item:focus-visible{ background:var(--panel-strong); outline:none; }

  .sm-divider-v{ width:1px; align-self:stretch; margin:2px 1px; background:var(--border); }

  .sm-col-quick{ justify-content:flex-start; gap:6px; padding-top:2px; }
  .sm-icon-btn{
    appearance:none; border:0; cursor:pointer;
    width:36px; height:36px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-dim);
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .sm-icon-btn svg{ width:16px; height:16px; }
  .sm-icon-btn:hover, .sm-icon-btn:focus-visible{ background:var(--panel-strong); color:var(--text); outline:none; }
  .sm-power:hover{ background:rgba(255,90,90,.14); color:#ffb4b0; }

  /* Search results, rendered inside the same start-menu panel */
  .start-menu.searching .sm-col-main,
  .start-menu.searching .sm-divider-v,
  .start-menu.searching .sm-col-quick{ display:none; }

  .sm-results{
    display:flex; flex-direction:column; gap:2px;
    width:100%; max-height:288px; overflow-y:auto;
  }
  .sm-result{
    appearance:none; border:0; cursor:pointer; width:100%;
    display:flex; align-items:center; gap:10px;
    padding:7px 8px; border-radius:var(--radius-sm);
    background:transparent; color:var(--text); text-align:left; font:inherit;
    transition:background .15s var(--ease);
  }
  .sm-result:hover, .sm-result:focus-visible{ background:var(--panel-strong); outline:none; }
  .sm-result-thumb{
    flex:none; width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
  }
  .sm-result-thumb img{ width:100%; height:100%; object-fit:contain; }
  .sm-result-thumb svg{ width:15px; height:15px; color:var(--glow); }
  .sm-result-text{ min-width:0; display:flex; flex-direction:column; gap:1px; }
  .sm-result-name{ font-family:var(--font-display); font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sm-result-desc{ font-family:var(--font-body); font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sm-empty{ padding:16px 8px; text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }

  /* Search */
  .search{
    flex:1 1 auto; min-width:0;
    display:flex; align-items:center; gap:8px;
    padding:0 10px 0 12px; height:38px;
    background:rgba(0,0,0,.22);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
  }
  .search svg{ flex:none; width:15px; height:15px; color:var(--text-dim); transition:color .2s var(--ease); }
  .search input{
    flex:1 1 auto; min-width:0; width:100%;
    background:transparent; border:0; outline:0;
    color:var(--text); font-family:var(--font-body); font-size:13.5px;
    padding:0;
  }
  .search input::placeholder{ color:var(--text-dim); }
  .search:focus-within{
    border-color: var(--border-strong);
    background:rgba(0,0,0,.32);
    box-shadow:0 0 0 3px var(--glow-faint);
  }
  .search:focus-within svg{ color:var(--glow); }
  .search-clear{
    flex:none; appearance:none; border:0; cursor:pointer;
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-strong); color:var(--text-dim);
    transition: background .15s var(--ease), color .15s var(--ease);
  }
  .search-clear:hover{ background:var(--border-strong); color:var(--text); }
  .search-clear svg{ width:10px; height:10px; }

  /* Tray */
  .tray{ display:flex; align-items:center; gap:4px; }
  .tray-btn{
    appearance:none; border:0; cursor:pointer;
    width:34px; height:34px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-dim);
    transition: background .18s var(--ease), color .18s var(--ease);
  }
  .tray-btn svg{ width:16px; height:16px; }
  .tray-btn:hover{ background:var(--panel-strong); color:var(--text); }
  .tray-btn:focus-visible{ outline:2px solid var(--glow-soft); outline-offset:2px; }

  .clock{
    appearance:none; border:0; background:transparent; font:inherit; cursor:pointer;
    font-family:var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align:right; line-height:1.25;
    padding:4px 10px 4px 10px; border-radius:var(--radius-sm);
    transition:background .15s var(--ease);
  }
  .clock:hover, .clock.is-open{ background:var(--panel-strong); }
  .clock .time{ font-size:13px; color:var(--text); }
  .clock .date{ font-size:10.5px; color:var(--text-dim); letter-spacing:.03em; }

  /* ── Volume popup ────────────────────────────────────────────── */
  .volume-popup{
    position:absolute; right:10px; bottom:calc(100% + 12px);
    width:196px; z-index:6; padding:14px 14px 12px;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border); border-radius:var(--radius-lg);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0; transform:translateY(8px) scale(.97); pointer-events:none;
    transition:opacity .16s var(--ease), transform .16s var(--ease);
  }
  .volume-popup.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .vol-row{ display:flex; align-items:center; gap:10px; }
  .vol-mute-btn{
    appearance:none; border:0; cursor:pointer; flex:none;
    width:30px; height:30px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--glow);
    transition:background .15s var(--ease);
  }
  .vol-mute-btn:hover{ background:var(--panel-strong); }
  .vol-mute-btn svg{ width:16px; height:16px; }
  .volume-popup.is-muted .vol-mute-btn{ color:var(--text-dim); }
  .vol-slider{
    flex:1 1 auto; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:2px; background:var(--border-strong);
    outline:none; cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--glow); box-shadow:0 0 8px 1px var(--glow-soft);
    margin-top:-4.5px;
  }
  .vol-slider::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; border:0;
    background:var(--glow); box-shadow:0 0 8px 1px var(--glow-soft);
  }
  .vol-slider::-webkit-slider-runnable-track{ height:4px; border-radius:2px; }
  .vol-pct{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); text-align:right; margin-top:8px; }

  /* ── Calendar popup ──────────────────────────────────────────── */
  .cal-popup{
    position:absolute; right:10px; bottom:calc(100% + 12px);
    width:232px; z-index:6; padding:12px;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border); border-radius:var(--radius-lg);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0; transform:translateY(8px) scale(.97); pointer-events:none;
    transition:opacity .16s var(--ease), transform .16s var(--ease);
  }
  .cal-popup.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-title{ font-family:var(--font-display); font-size:12.5px; font-weight:500; }
  .cal-nav{
    appearance:none; border:0; cursor:pointer; width:24px; height:24px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-dim);
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .cal-nav:hover{ background:var(--panel-strong); color:var(--text); }
  .cal-nav svg{ width:13px; height:13px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  .cal-dow{ font-family:var(--font-mono); font-size:9px; color:var(--text-dim); text-align:center; padding:3px 0 5px; }
  .cal-day{
    font-family:var(--font-body); font-size:11px; text-align:center;
    padding:5px 0; border-radius:6px; color:var(--text);
  }
  .cal-day.outside{ color:var(--text-dim); opacity:.4; }
  .cal-day.today{ background:var(--glow-faint); color:var(--glow); font-weight:600; box-shadow:0 0 0 1px var(--border-strong); }

  /* ── Desktop icons ──────────────────────────────────────────── */
  /* Icons are free-positioned (JS sets left/top in px) so they can be
     dragged anywhere on the desktop; this wrap just bounds that area and
     hosts the marquee drag-select rectangle. */
  .icons{
    position:absolute; inset:0;
    touch-action:none;
  }

  .icon{
    position:absolute;
    appearance:none; border:0; cursor:pointer; background:transparent;
    color:var(--text); font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    width:150px; padding:16px 6px 12px; border-radius:var(--radius-sm);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    -webkit-user-drag:none; user-drag:none;
    -webkit-user-select:none; user-select:none;
    transition: transform .12s var(--ease), opacity .18s var(--ease), filter .18s var(--ease);
  }
  /* Browsers make <img>/<svg> natively draggable and selectable by default;
     that fights our own pointer-based drag (ghost image, stray text/image
     selection mid-drag), so it's switched off everywhere inside an icon. */
  .icon img, .icon svg{
    -webkit-user-drag:none; user-drag:none;
    -webkit-user-select:none; user-select:none;
  }
  body.no-select{ -webkit-user-select:none; user-select:none; }
  .icon:active{ transform:scale(.97); }
  .icon.dim{ opacity:.3; filter:saturate(.5); }
  .icon.dragging-icon{ transition:none; z-index:3; cursor:grabbing; }

  .icon-glyph{
    position:relative;
    width:88px; height:88px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    transition: box-shadow .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .icon-glyph svg{ width:42px; height:42px; color:var(--glow); }
  .icon-glyph img{ width:70px; height:70px; display:block; object-fit:contain; }

  /* Marks the tile as a shortcut to a live site — swap the glyph svg for a
     project logo later and this badge still reads correctly. */
  .icon-shortcut{
    position:absolute; right:-7px; bottom:-7px;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--panel-strong), var(--void));
    border:1px solid var(--border-strong);
    box-shadow:0 1px 5px rgba(0,0,0,.55);
  }
  .icon-shortcut svg{ width:15px; height:15px; color:var(--text-dim); }

  .icon-label{
    font-family:var(--font-display); font-size:14px; font-weight:500;
    text-align:center; line-height:1.25; padding:1px 7px; border-radius:4px;
    transition:background .15s var(--ease);
  }

  .icon:hover .icon-glyph{
    border-color:var(--border-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 16px -6px var(--glow-soft);
  }

  .icon.selected .icon-glyph{
    border-color:var(--border-strong);
    background:linear-gradient(180deg, var(--panel-strong), var(--panel-strong));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px var(--border-strong), 0 0 18px -4px var(--glow-soft);
  }
  .icon.selected .icon-label{ background:var(--glow-faint); }

  .icon:focus-visible{ outline:none; }
  .icon:focus-visible .icon-glyph{ outline:2px solid var(--glow-soft); outline-offset:2px; }

  @keyframes launch-pulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(.9); }
    100%{ transform:scale(1); }
  }
  .icon.launching .icon-glyph{
    animation: launch-pulse .4s var(--ease);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px var(--glow-soft), 0 0 30px -2px var(--glow-soft);
  }

  .toast{
    position:fixed; left:50%; bottom:96px; z-index:5;
    transform:translateX(-50%) translateY(6px);
    padding:8px 14px; border-radius:var(--radius-sm);
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border-strong);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font-family:var(--font-mono); font-size:11.5px; color:var(--text);
    opacity:0; pointer-events:none;
    transition:opacity .22s var(--ease), transform .22s var(--ease);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── Taskbar running-app icon ───────────────────────────────── */
  .taskbar-apps{ display:flex; align-items:center; gap:4px; flex:none; }
  .taskbar-app-btn{
    position:relative;
    appearance:none; border:0; cursor:pointer;
    width:34px; height:34px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:var(--glow-faint); color:var(--glow);
    box-shadow:0 0 0 1px var(--border-strong), 0 0 14px -5px var(--glow-soft);
    transition:background .18s var(--ease), box-shadow .2s var(--ease);
  }
  .taskbar-app-btn svg{ width:16px; height:16px; }
  .taskbar-app-btn:hover{ background:var(--panel-strong); box-shadow:0 0 0 1px var(--border-strong), 0 0 20px -3px var(--glow-soft); }
  .taskbar-app-btn::after{
    content:''; position:absolute; left:50%; bottom:3px; width:4px; height:4px;
    border-radius:50%; background:var(--glow); transform:translateX(-50%);
    box-shadow:0 0 6px 1px var(--glow-soft);
  }
  .taskbar-app-btn.is-active{ background:var(--panel-strong); }

  /* ── Window ──────────────────────────────────────────────────── */
  .window{
    position:fixed; z-index:20;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    overflow:hidden;
    min-width:320px; min-height:220px;
  }
  .window[hidden]{ display:none; }
  .window.maximized{ border-radius:0; }
  .window.dragging{ user-select:none; }

  .win-titlebar{
    flex:none; display:flex; align-items:center; gap:8px;
    padding:9px 9px 9px 12px;
    border-bottom:1px solid var(--border);
    cursor:grab;
    -webkit-tap-highlight-color:transparent;
  }
  .window.dragging .win-titlebar{ cursor:grabbing; }
  .win-titlebar svg{ flex:none; width:15px; height:15px; color:var(--glow); }
  .win-title{ flex:1 1 auto; min-width:0; font-family:var(--font-display); font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .win-controls{ flex:none; display:flex; align-items:center; gap:4px; }
  .win-btn{
    appearance:none; border:0; cursor:pointer;
    width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-dim);
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .win-btn svg{ width:11px; height:11px; }
  .win-btn:hover{ background:var(--panel-strong); color:var(--text); }
  .win-close:hover{ background:rgba(255,90,90,.16); color:#ffb4b0; }

  .win-toolbar{
    flex:none; display:flex; align-items:center; gap:8px;
    padding:7px 10px; border-bottom:1px solid var(--border);
  }
  .win-back{
    appearance:none; border:0; cursor:pointer; flex:none;
    width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-dim);
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .win-back svg{ width:13px; height:13px; }
  .win-back:hover:not(:disabled){ background:var(--panel-strong); color:var(--text); }
  .win-back:disabled{ opacity:.35; cursor:default; }

  .win-breadcrumb{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:2px;
    overflow-x:auto; white-space:nowrap; scrollbar-width:none;
    font-family:var(--font-body); font-size:11.5px;
  }
  .win-breadcrumb::-webkit-scrollbar{ display:none; }
  .win-breadcrumb-sep{ flex:none; color:var(--text-dim); opacity:.5; font-size:11px; }
  .win-crumb{
    appearance:none; border:0; cursor:pointer; background:transparent; flex:none;
    padding:3px 7px; border-radius:6px; color:var(--text-dim);
    font:inherit; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .win-crumb:hover{ background:var(--panel-strong); color:var(--text); }
  .win-crumb.current{ color:var(--text); font-weight:500; }

  .win-search{
    flex:none; width:150px; display:flex; align-items:center; gap:6px;
    padding:5px 10px; border-radius:999px;
    background:var(--panel-strong); border:1px solid var(--border);
  }
  .win-search svg{ flex:none; width:12px; height:12px; color:var(--text-dim); }
  .win-search input{
    flex:1 1 auto; min-width:0; border:0; outline:0; background:transparent;
    font-family:var(--font-body); font-size:11.5px; color:var(--text);
  }
  .win-search input::placeholder{ color:var(--text-dim); }

  @media (max-width:640px){
    .win-search{ width:92px; }
  }

  .win-body{ flex:1 1 auto; min-height:0; display:flex; }
  .win-content{
    flex:1 1 auto; min-width:0; overflow-y:auto;
    padding:14px;
    display:grid; grid-template-columns:repeat(auto-fill, 78px); gap:12px 8px;
    align-content:start;
  }
  .win-file{
    appearance:none; border:0; cursor:pointer; background:transparent;
    color:var(--text); font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    width:78px; padding:8px 4px; border-radius:var(--radius-sm);
    transition:background .15s var(--ease);
  }
  .win-file:hover, .win-file:focus-visible{ background:var(--panel-strong); outline:none; }
  .win-file-thumb{
    width:38px; height:38px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
  }
  .win-file-thumb img{ width:100%; height:100%; object-fit:contain; }
  .win-file-name{ font-family:var(--font-display); font-size:11px; font-weight:500; text-align:center; line-height:1.25; }
  .win-file-tag{ font-family:var(--font-mono); font-size:8.5px; color:var(--text-dim); text-align:center; }

  .win-empty{
    grid-column:1 / -1; align-self:center; justify-self:center; text-align:center;
    padding:30px 16px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
  }

  .win-sidebar{
    flex:none; width:132px; border-left:1px solid var(--border);
    padding:10px 8px; display:flex; flex-direction:column; gap:2px;
    overflow-y:auto;
  }
  .win-nav-item{
    appearance:none; border:0; cursor:pointer; width:100%;
    display:flex; align-items:center; gap:8px;
    padding:7px 8px; border-radius:var(--radius-sm);
    background:transparent; color:var(--text-dim); text-align:left;
    font-family:var(--font-body); font-size:12px;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .win-nav-item svg{ flex:none; width:15px; height:15px; }
  .win-nav-item:hover{ background:var(--panel-strong); color:var(--text); }
  .win-nav-item.active{ background:var(--glow-faint); color:var(--text); }
  .win-nav-item.active svg{ color:var(--glow); }

  @media (max-width:640px){
    .win-sidebar{ width:96px; }
    .win-nav-item span{ display:none; }
    .win-nav-item{ justify-content:center; padding:9px; }
  }

  .viewer-stage{
    position:relative;
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:18px; overflow:auto;
    background:rgba(0,0,0,.22);
  }
  .viewer-stage img{
    max-width:100%; max-height:100%; object-fit:contain;
    border-radius:8px; box-shadow:0 14px 44px rgba(0,0,0,.55);
  }

  .viewer-nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    appearance:none; cursor:pointer;
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
    color:var(--text-dim);
    box-shadow:0 10px 26px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%);
    transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .viewer-nav svg{ width:16px; height:16px; }
  .viewer-nav:hover{ background:var(--panel-strong); color:var(--text); border-color:var(--border-strong); }
  .viewer-prev{ left:12px; }
  .viewer-next{ right:12px; }

  /* ── Doc viewer (in-OS "read me" cards — same one a Documents file and a
     desktop icon's "what is this" popup can both open) ──────────────── */
  .doc-stage{
    flex:1 1 auto; min-height:0; overflow:auto;
    padding:20px; display:flex; justify-content:center;
    background:rgba(0,0,0,.22);
  }
  .doc-card{
    width:100%; max-width:420px; align-self:flex-start;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:0 20px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    padding:22px;
    transition:max-width .2s var(--ease);
  }
  /* Maximized window = a page, not a tiny card floating in empty space:
     grows to fill top-to-bottom and gets noticeably wider, but stays short
     of the window's full width so it still reads as a page with margins. */
  .window.maximized .doc-card{
    max-width:680px; align-self:stretch;
  }
  .doc-card-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .doc-card-mark{
    flex:none; width:64px; height:64px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--panel-strong), var(--panel));
    border:1px solid var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .doc-card-mark img{ width:50px; height:50px; object-fit:contain; }
  .doc-card-title{ font-family:var(--font-display); font-size:15px; font-weight:600; line-height:1.3; }
  .doc-card-status{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:6px; padding:2px 9px; border-radius:999px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:#6fb3ff; background:rgba(88,166,255,.14); border:1px solid rgba(88,166,255,.4);
  }
  .doc-card-status::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:#6fb3ff; box-shadow:0 0 8px rgba(88,166,255,.65);
  }
  .doc-card-body{ font-family:var(--font-body); font-size:13px; line-height:1.65; color:var(--text); }
  .doc-card-body p{ margin:0 0 12px; }
  .doc-card-body p:last-child{ margin-bottom:0; }

  /* ── Power flash — a quick blackout/fade-back-in placeholder until real
     shutdown/restart behavior gets designed ─────────────────────────── */
  .power-flash{
    position:fixed; inset:0; z-index:60;
    background:#000; opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .power-flash.active{ opacity:1; }

  /* ── Embedded-site window (TNFC / BAD MODS) ─────────────────────────── */
  .iframe-stage{
    position:relative; flex:1 1 auto; min-height:0;
    background:#0a0a0c;
  }
  .iframe-stage iframe{
    width:100%; height:100%; border:0; display:block;
    background:#fff; /* avoids a black flash while a light-themed site loads */
  }
  .iframe-loading{
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-dim); background:rgba(10,10,12,.55);
    pointer-events:none;
    transition:opacity .25s var(--ease);
  }
  .iframe-loading.hidden{ opacity:0; }

  @media (max-width:640px){
    .viewer-nav{ width:32px; height:32px; }
    .viewer-nav svg{ width:14px; height:14px; }
  }

  @media (max-width: 640px){
    .boot-mark{ font-size:9.5px; top:16px; }
    .taskbar{ gap:6px; padding:6px 8px; }
    .start-btn span{ display:none; }
    .start-btn{ padding:8px; }
    .clock .date{ display:none; }
    .tray-btn:nth-child(1){ display:none; } /* keep it tight on very small phones */
    .icon{ width:120px; }
    .icon-glyph{ width:72px; height:72px; }
    .icon-glyph svg{ width:34px; height:34px; }
    .icon-glyph img{ width:56px; height:56px; }
  }

  /* Rubber-band drag-select rectangle drawn while dragging on empty desktop */
  .marquee{
    position:fixed; z-index:4; pointer-events:none;
    background:var(--glow-faint);
    border:1px solid var(--glow-soft);
    border-radius:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .taskbar, .boot-mark{ animation:none; opacity:1; transform:none; }
    .start-btn, .search, .tray-btn, .search-clear, .icon-glyph, .icon-label, .toast{ transition:none; }
    .icon.launching .icon-glyph{ animation:none; }
  }

<script>
(function(){
  "use strict";

  function pad(n){ return n.toString().padStart(2,'0'); }

  function tick(){
    var now = new Date();
    var h = now.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 || 12;
    var timeEl = document.getElementById('clock-time');
    var dateEl = document.getElementById('clock-date');
    if (timeEl) timeEl.textContent = h12 + ':' + pad(now.getMinutes()) + ' ' + ampm;
    if (dateEl) dateEl.textContent = now.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }
  tick();
  setInterval(tick, 1000 * 15); // minute-granularity display, cheap to refresh

  var icons = Array.prototype.slice.call(document.querySelectorAll('.icon'));
  var toast = document.getElementById('toast');
  var toastTimer;
  var iconsWrap = document.getElementById('icons');
  var suppressNextClick = false;

  function launch(icon, opts){
    opts = opts || {};
    // Opening something clears the highlight, like a normal desktop — only
    // a plain single click should leave an icon looking selected.
    icons.forEach(function(i){ i.classList.remove('selected'); });
    icon.classList.remove('launching');
    void icon.offsetWidth; // restart the pulse animation on repeat launches
    icon.classList.add('launching');
    // Fallback in case the animation never fires (prefers-reduced-motion
    // turns it off) — the animationend listener normally handles this.
    setTimeout(function(){ icon.classList.remove('launching'); }, 450);

    if (opts.skipToast) return;
    var name = icon.getAttribute('data-name') || 'Program';
    if (toast){
      toast.textContent = 'Launching ' + name + '…';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1100);
    }
  }

  // STAC has nothing to launch yet, so its icon opens its Documents
  // read-me (same one that lives in Documents) instead of the generic
  // "Launching…" toast — still gets the same tactile pulse feedback.
  function activateIcon(icon){
    var name = icon.getAttribute('data-name');
    if (name === 'STAC'){
      launch(icon, { skipToast: true });
      openDoc(DOCS[0]);
    } else if (SITES[name]){
      launch(icon, { skipToast: true });
      openSite(name);
    } else {
      launch(icon);
    }
  }

  icons.forEach(function(icon){
    icon.addEventListener('click', function(){
      if (suppressNextClick){ suppressNextClick = false; return; } // just finished a drag, not a select
      icons.forEach(function(i){ if (i !== icon) i.classList.remove('selected'); });
      icon.classList.toggle('selected');
    });
    icon.addEventListener('dblclick', function(e){ e.preventDefault(); activateIcon(icon); });
    icon.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activateIcon(icon); }
    });
    // The launch pulse is a one-shot animation; without this its glow
    // would sit on the glyph forever instead of fading with the animation.
    icon.addEventListener('animationend', function(e){
      if (e.animationName === 'launch-pulse') icon.classList.remove('launching');
    });
  });

  // ── Free-form desktop layout: icons default into a column grid on load,
  // then can be dragged anywhere; a marquee (rubber-band) drag over empty
  // space multi-selects whatever it crosses, same as a real desktop. ──
  var ICON_W = 150, ICON_H = 130, ROW_GAP = 10, COL_GAP = 20, PAD_TOP = 76, PAD_LEFT = 18, PAD_BOTTOM = 104;

  function layoutIcons(){
    if (!iconsWrap) return;
    var availH = Math.max(ICON_H, iconsWrap.clientHeight - PAD_TOP - PAD_BOTTOM);
    var rows = Math.max(1, Math.floor((availH + ROW_GAP) / (ICON_H + ROW_GAP)));
    var col = 0, row = 0;
    icons.forEach(function(icon){
      if (icon.dataset.moved === '1') return; // leave user-placed icons alone
      icon.style.left = (PAD_LEFT + col * (ICON_W + COL_GAP)) + 'px';
      icon.style.top = (PAD_TOP + row * (ICON_H + ROW_GAP)) + 'px';
      row++;
      if (row >= rows){ row = 0; col++; }
    });
  }
  layoutIcons();

  function clampMovedIcons(){
    if (!iconsWrap) return;
    var maxX = iconsWrap.clientWidth, maxY = iconsWrap.clientHeight;
    icons.forEach(function(icon){
      if (icon.dataset.moved !== '1') return;
      var l = Math.min(Math.max(icon.offsetLeft, 0), Math.max(0, maxX - icon.offsetWidth));
      var t = Math.min(Math.max(icon.offsetTop, 0), Math.max(0, maxY - icon.offsetHeight));
      icon.style.left = l + 'px';
      icon.style.top = t + 'px';
    });
  }

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ layoutIcons(); clampMovedIcons(); }, 120);
  });

  // Browsers natively drag <img>/<svg> and select text on their own the
  // moment a pointer moves over them mid-press — that fight is what made
  // dragging feel broken (ghost thumbnail + "no drop" cursor, motion
  // stopping partway, stray selection). Kill native drag/selection outright
  // for the whole desktop-icon layer so only our own pointer logic drives it.
  if (iconsWrap){
    iconsWrap.addEventListener('dragstart', function(e){ e.preventDefault(); });
  }
  document.addEventListener('selectstart', function(e){
    if (e.target.closest && e.target.closest('#icons')) e.preventDefault();
  });

  // Marquee (rubber-band) select — a highlight box you draw with the cursor
  // over empty desktop space to multi-select whatever it touches.
  var marqueeEl = document.createElement('div');
  marqueeEl.className = 'marquee';
  marqueeEl.hidden = true;
  document.body.appendChild(marqueeEl);

  var marqueeState = null;
  var didMarqueeDrag = false;

  function startMarquee(e){
    if (e.button !== undefined && e.button !== 0) return;
    endMarquee(); // clear out any prior drag that never got a clean pointerup
    marqueeState = { x0: e.clientX, y0: e.clientY, moved: false };
    if (!e.shiftKey) icons.forEach(function(i){ i.classList.remove('selected'); });
    document.addEventListener('pointermove', updateMarquee);
    document.addEventListener('pointerup', endMarquee);
    document.addEventListener('pointercancel', endMarquee);
  }
  function updateMarquee(e){
    if (!marqueeState) return;
    var x0 = marqueeState.x0, y0 = marqueeState.y0, x1 = e.clientX, y1 = e.clientY;
    var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    if (!marqueeState.moved && (dx > 3 || dy > 3)){
      marqueeState.moved = true;
      marqueeEl.hidden = false;
      document.body.classList.add('no-select');
    }
    if (!marqueeState.moved) return;
    e.preventDefault();
    var left = Math.min(x0, x1), top = Math.min(y0, y1);
    marqueeEl.style.left = left + 'px';
    marqueeEl.style.top = top + 'px';
    marqueeEl.style.width = dx + 'px';
    marqueeEl.style.height = dy + 'px';
    var rect = { left: left, top: top, right: left + dx, bottom: top + dy };
    icons.forEach(function(icon){
      var r = icon.getBoundingClientRect();
      var intersects = !(r.right < rect.left || r.left > rect.right || r.bottom < rect.top || r.top > rect.bottom);
      icon.classList.toggle('selected', intersects);
    });
  }
  function endMarquee(){
    if (marqueeState && marqueeState.moved) didMarqueeDrag = true;
    marqueeState = null;
    marqueeEl.hidden = true;
    marqueeEl.style.width = '0px';
    marqueeEl.style.height = '0px';
    document.body.classList.remove('no-select');
    document.removeEventListener('pointermove', updateMarquee);
    document.removeEventListener('pointerup', endMarquee);
    document.removeEventListener('pointercancel', endMarquee);
  }

  // Icon dragging — grabs the whole current selection if the icon you press
  // is already part of it, otherwise selects just that one first.
  var iconDragState = null;

  function endIconDrag(e){
    if (!iconDragState || (e && e.pointerId !== undefined && e.pointerId !== iconDragState.pointerId)) return;
    var st = iconDragState;
    iconDragState = null;
    st.items.forEach(function(it){ it.el.classList.remove('dragging-icon'); });
    document.body.classList.remove('no-select');
    if (st.moved){
      suppressNextClick = true;
      try { st.capturedEl.releasePointerCapture(st.pointerId); } catch(err){}
    }
  }

  if (iconsWrap){
    iconsWrap.addEventListener('pointerdown', function(e){
      if (e.button !== undefined && e.button !== 0) return;
      endMarquee();   // defensively clear any stuck gesture before starting a new one
      endIconDrag();
      var iconEl = e.target.closest('.icon');
      if (!iconEl){ startMarquee(e); return; }

      e.preventDefault(); // stop the native image-drag/selection gesture from ever starting
      if (!iconEl.classList.contains('selected')){
        icons.forEach(function(i){ i.classList.remove('selected'); });
        iconEl.classList.add('selected');
      }
      var group = icons.filter(function(i){ return i.classList.contains('selected'); });
      iconDragState = {
        pointerId: e.pointerId,
        capturedEl: iconEl,
        startX: e.clientX, startY: e.clientY,
        moved: false,
        items: group.map(function(i){ return { el: i, left: i.offsetLeft, top: i.offsetTop }; })
      };
      try { iconEl.setPointerCapture(e.pointerId); } catch(err){}
    });

    iconsWrap.addEventListener('pointermove', function(e){
      if (!iconDragState || e.pointerId !== iconDragState.pointerId) return;
      var dx = e.clientX - iconDragState.startX;
      var dy = e.clientY - iconDragState.startY;
      if (!iconDragState.moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)){
        iconDragState.moved = true;
        iconDragState.items.forEach(function(it){ it.el.classList.add('dragging-icon'); });
        document.body.classList.add('no-select');
      }
      if (!iconDragState.moved) return;
      var maxX = iconsWrap.clientWidth, maxY = iconsWrap.clientHeight;
      iconDragState.items.forEach(function(it){
        var nl = Math.min(Math.max(it.left + dx, 0), Math.max(0, maxX - it.el.offsetWidth));
        var nt = Math.min(Math.max(it.top + dy, 0), Math.max(0, maxY - it.el.offsetHeight));
        it.el.style.left = nl + 'px';
        it.el.style.top = nt + 'px';
        it.el.dataset.moved = '1';
      });
    });

    iconsWrap.addEventListener('pointerup', endIconDrag);
    iconsWrap.addEventListener('pointercancel', endIconDrag);

    iconsWrap.addEventListener('click', function(e){
      if (!e.target.closest('.icon')){
        if (didMarqueeDrag){ didMarqueeDrag = false; return; } // marquee already set the selection
        icons.forEach(function(i){ i.classList.remove('selected'); });
        closeAllPopups();
      }
    });
  }

  // ── Start menu ──────────────────────────────────────────────
  var startBtn = document.getElementById('start-btn');
  var startMenu = document.getElementById('start-menu');

  function openStartMenu(){
    if (!startMenu) return;
    startMenu.classList.add('open');
    startMenu.setAttribute('aria-hidden', 'false');
    if (startBtn) startBtn.setAttribute('aria-expanded', 'true');
  }
  function closeStartMenu(){
    if (!startMenu) return;
    startMenu.classList.remove('open');
    startMenu.setAttribute('aria-hidden', 'true');
    if (startBtn) startBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleStartMenu(e){
    if (e) e.stopPropagation();
    if (startMenu && startMenu.classList.contains('open')){
      closeStartMenu();
    } else {
      closeAllPopups('start');
      exitSearchMode(); // opening via the button always shows the category menu, not stale results
      openStartMenu();
    }
  }

  if (startBtn) startBtn.addEventListener('click', toggleStartMenu);

  if (startMenu){
    startMenu.addEventListener('click', function(e){
      var item = e.target.closest('.sm-item, .sm-icon-btn');
      if (!item) return;
      if (item.id === 'sm-files-btn'){ openFilesWindow(); return; }
      var path = item.getAttribute('data-path');
      if (path){ openFilesAt(path); return; }
      var name = item.getAttribute('data-name') || 'that';
      if (name === 'Power'){ playPowerCycle(); closeStartMenu(); return; }
      if (toast){
        toast.textContent = 'Opening ' + name + '…';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1100);
      }
      closeStartMenu();
    });
  }

  document.addEventListener('click', function(e){
    if (startMenu && startMenu.classList.contains('open') &&
        !e.target.closest('.start-menu') && !e.target.closest('#start-btn') && !e.target.closest('.search')){
      closeStartMenu();
    }
    var vp = document.getElementById('volume-popup');
    if (vp && vp.classList.contains('open') &&
        !e.target.closest('.volume-popup') && !e.target.closest('#volume-btn')){
      closeVolumePopup();
    }
    var cp = document.getElementById('cal-popup');
    if (cp && cp.classList.contains('open') &&
        !e.target.closest('.cal-popup') && !e.target.closest('#clock-btn')){
      closeCalendar();
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeAllPopups();
  });

  var input = document.getElementById('search-input');
  var clearBtn = document.getElementById('search-clear');
  var smResults = document.getElementById('sm-results');

  // Every launchable thing — desktop icons and start-menu items alike —
  // is searchable from one shared index, so results here and the future
  // "My PC" window that lists everything can both read off the same DOM.
  var searchSources = Array.prototype.slice.call(
    document.querySelectorAll('#icons [data-name], #start-menu .sm-col-main [data-name], #start-menu .sm-col-quick [data-name]')
  );

  function getThumb(el){
    var img = el.querySelector('.icon-glyph img');
    if (img) return img.cloneNode(true);
    var svg = el.querySelector('svg');
    return svg ? svg.cloneNode(true) : null;
  }

  function exitSearchMode(){
    if (startMenu) startMenu.classList.remove('searching');
    if (smResults) smResults.hidden = true;
  }

  function activateResult(el){
    if (el.classList.contains('icon')){
      activateIcon(el);
    } else if (el.id === 'sm-files-btn'){
      openFilesWindow();
    } else if (el.getAttribute('data-path')){
      openFilesAt(el.getAttribute('data-path'));
    } else {
      var name = el.getAttribute('data-name') || 'that';
      if (name === 'Power'){
        playPowerCycle();
      } else if (toast){
        toast.textContent = 'Opening ' + name + '…';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1100);
      }
    }
    if (input) input.value = '';
    if (clearBtn) clearBtn.hidden = true;
    exitSearchMode();
    closeStartMenu();
  }

  function runSearch(){
    var q = input ? input.value.trim().toLowerCase() : '';
    if (clearBtn) clearBtn.hidden = !q;

    if (!q){
      exitSearchMode();
      closeStartMenu();
      return;
    }

    var matches = searchSources.filter(function(el){
      var name = (el.getAttribute('data-name') || '').toLowerCase();
      var desc = (el.getAttribute('data-desc') || '').toLowerCase();
      return name.indexOf(q) !== -1 || desc.indexOf(q) !== -1;
    });

    if (smResults){
      smResults.innerHTML = '';
      if (matches.length === 0){
        var empty = document.createElement('div');
        empty.className = 'sm-empty';
        empty.textContent = 'No results for “' + (input ? input.value.trim() : '') + '”';
        smResults.appendChild(empty);
      } else {
        matches.forEach(function(el){
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'sm-result';
          row.setAttribute('role', 'menuitem');

          var thumbWrap = document.createElement('span');
          thumbWrap.className = 'sm-result-thumb';
          var thumb = getThumb(el);
          if (thumb) thumbWrap.appendChild(thumb);
          row.appendChild(thumbWrap);

          var text = document.createElement('span');
          text.className = 'sm-result-text';
          var nameEl = document.createElement('span');
          nameEl.className = 'sm-result-name';
          nameEl.textContent = el.getAttribute('data-name') || '';
          var descEl = document.createElement('span');
          descEl.className = 'sm-result-desc';
          descEl.textContent = el.getAttribute('data-desc') || '';
          text.appendChild(nameEl);
          text.appendChild(descEl);
          row.appendChild(text);

          row.addEventListener('click', function(){ activateResult(el); });
          smResults.appendChild(row);
        });
      }
      smResults.hidden = false;
    }

    if (startMenu) startMenu.classList.add('searching');
    openStartMenu();
  }

  if (input){
    input.addEventListener('input', runSearch);
    input.addEventListener('focus', function(){ if (input.value.trim()) runSearch(); });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        var first = smResults ? smResults.querySelector('.sm-result') : null;
        if (first) first.click();
      } else if (e.key === 'Escape'){
        input.value = '';
        runSearch();
      }
    });
  }
  if (clearBtn){
    clearBtn.addEventListener('click', function(){
      input.value = '';
      runSearch();
      input.focus();
    });
    clearBtn.hidden = true;
  }

  // ── Generic window chrome: drag, minimize, maximize (button AND
  // double-click the title bar), close, focus-on-click. Every window
  // (Files, Photos, the photo viewer, and whatever comes next) is wired
  // through this one function instead of reimplementing it per-window.
  var taskbarApps = document.getElementById('taskbar-apps');

  function wireWindowChrome(win, opts){
    opts = opts || {};
    var titlebar = win.querySelector('.win-titlebar');
    var minBtn = win.querySelector('.win-min');
    var maxBtn = win.querySelector('.win-max');
    var closeBtn = win.querySelector('.win-close');
    var state = { maximized: false, prevRect: null };

    function focus(){ win.style.zIndex = '21'; }
    function applyRect(r){
      win.style.left = r.left + 'px'; win.style.top = r.top + 'px';
      win.style.width = r.width + 'px'; win.style.height = r.height + 'px';
    }
    function defaultRect(){
      var w = Math.min(opts.width || 560, window.innerWidth - 32);
      var h = Math.min(opts.height || 420, window.innerHeight - 150);
      return {
        left: Math.max(14, (window.innerWidth - w) / 2 + (opts.offset || 0)),
        top: Math.max(14, (window.innerHeight - h) / 2 - 20),
        width: w, height: h
      };
    }
    function toggleMaximize(){
      if (!state.maximized){
        var r = win.getBoundingClientRect();
        state.prevRect = { left: r.left, top: r.top, width: r.width, height: r.height };
        state.maximized = true;
        win.classList.add('maximized');
        applyRect({ left: 10, top: 10, width: window.innerWidth - 20, height: window.innerHeight - 118 });
      } else {
        state.maximized = false;
        win.classList.remove('maximized');
        if (state.prevRect) applyRect(state.prevRect);
      }
    }
    function show(resetPos){
      if (win.hidden && resetPos !== false) applyRect(defaultRect());
      win.hidden = false;
      focus();
      if (opts.onShow) opts.onShow();
    }
    function minimize(){
      win.hidden = true;
      if (opts.onMinimize) opts.onMinimize();
    }
    function close(){
      win.hidden = true;
      state.maximized = false;
      win.classList.remove('maximized');
      if (opts.onClose) opts.onClose();
    }

    if (minBtn) minBtn.addEventListener('click', minimize);
    if (closeBtn) closeBtn.addEventListener('click', close);
    if (maxBtn) maxBtn.addEventListener('click', toggleMaximize);
    win.addEventListener('pointerdown', focus);

    if (titlebar){
      titlebar.addEventListener('dblclick', function(e){
        if (e.target.closest('.win-btn')) return;
        toggleMaximize();
      });
      var dragState = null;
      titlebar.addEventListener('pointerdown', function(e){
        if (e.target.closest('.win-btn') || state.maximized) return;
        var r = win.getBoundingClientRect();
        dragState = { startX: e.clientX, startY: e.clientY, left: r.left, top: r.top };
        win.classList.add('dragging');
        focus();
        try { titlebar.setPointerCapture(e.pointerId); } catch(err){}
      });
      titlebar.addEventListener('pointermove', function(e){
        if (!dragState) return;
        var dx = e.clientX - dragState.startX;
        var dy = e.clientY - dragState.startY;
        var nl = Math.min(Math.max(dragState.left + dx, -win.offsetWidth + 90), window.innerWidth - 90);
        var nt = Math.min(Math.max(dragState.top + dy, 0), window.innerHeight - 44);
        win.style.left = nl + 'px';
        win.style.top = nt + 'px';
      });
      var endDrag = function(){ dragState = null; win.classList.remove('dragging'); };
      titlebar.addEventListener('pointerup', endDrag);
      titlebar.addEventListener('pointercancel', endDrag);
    }

    return { show: show, minimize: minimize, close: close, focus: focus };
  }

  function setTaskbarIcon(key, svgHtml, label, onClick){
    if (!taskbarApps) return;
    if (taskbarApps.querySelector('[data-app="' + key + '"]')) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'taskbar-app-btn';
    btn.setAttribute('data-app', key);
    btn.setAttribute('aria-label', label);
    btn.innerHTML = svgHtml;
    btn.addEventListener('click', onClick);
    taskbarApps.appendChild(btn);
  }
  function clearTaskbarIcon(key){
    if (!taskbarApps) return;
    var el = taskbarApps.querySelector('[data-app="' + key + '"]');
    if (el) el.remove();
  }

  var currentPath = 'thispc';
  var navHistory = [];

  function fsChain(path){
    var chain = []; var p = path;
    while (p){ chain.unshift(p); p = FS[p] ? FS[p].parent : null; }
    return chain;
  }
  function rootBranch(path){
    var chain = fsChain(path);
    return chain.length > 1 ? chain[1] : 'thispc';
  }

  function renderEmptyView(container, label){
    if (!container) return;
    container.innerHTML = '';
    var e = document.createElement('div');
    e.className = 'win-empty';
    e.textContent = label + ' — nothing here yet.';
    container.appendChild(e);
  }

  function makeTile(iconHtml, name, tagText, onOpen){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'win-file';
    btn.setAttribute('data-search-name', name.toLowerCase());

    var thumb = document.createElement('span');
    thumb.className = 'win-file-thumb';
    if (typeof iconHtml === 'string') thumb.innerHTML = iconHtml; else if (iconHtml) thumb.appendChild(iconHtml);
    btn.appendChild(thumb);

    var nameEl = document.createElement('span');
    nameEl.className = 'win-file-name';
    nameEl.textContent = name;
    btn.appendChild(nameEl);

    var tag = document.createElement('span');
    tag.className = 'win-file-tag';
    tag.textContent = tagText;
    btn.appendChild(tag);

    btn.addEventListener('dblclick', onOpen);
    return btn;
  }

  function renderFolderTiles(container, keys){
    keys.forEach(function(key){
      var node = FS[key];
      container.appendChild(makeTile(node.icon, node.name, 'Folder', function(){ navigate(key); }));
    });
  }

  function renderAppsView(container, names){
    var files = searchSources.filter(function(el){
      return el.classList.contains('icon') && names.indexOf(el.getAttribute('data-name')) !== -1;
    });
    if (files.length === 0){ renderEmptyView(container, FS[currentPath].name); return; }
    files.forEach(function(el){
      var label = el.getAttribute('data-name') || '';
      var tag = el.getAttribute('data-kind') === 'dev' ? 'In dev' : 'Live site';
      container.appendChild(makeTile(getThumb(el), label, tag, function(){ activateIcon(el); }));
    });
  }

  function renderPicturesView(container){
    var items = PHOTOS.filter(function(p){ return p.src; });
    if (items.length === 0){ renderEmptyView(container, 'Pictures'); return; }
    items.forEach(function(p){
      var img = document.createElement('img');
      img.src = p.src; img.alt = p.name;
      container.appendChild(makeTile(img, p.name, '.' + p.ext, function(){ openViewer(p); }));
    });
  }

  function renderDocumentsView(container){
    if (DOCS.length === 0){ renderEmptyView(container, 'Documents'); return; }
    DOCS.forEach(function(d){
      container.appendChild(makeTile(DOC_SVG, d.name, '.' + d.ext, function(){ openDoc(d); }));
    });
  }

  function renderBreadcrumb(path){
    if (!winBreadcrumb) return;
    winBreadcrumb.innerHTML = '';
    fsChain(path).forEach(function(key, i, chain){
      if (i > 0){
        var sep = document.createElement('span');
        sep.className = 'win-breadcrumb-sep';
        sep.textContent = '/';
        winBreadcrumb.appendChild(sep);
      }
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'win-crumb' + (i === chain.length - 1 ? ' current' : '');
      btn.textContent = FS[key].name;
      btn.addEventListener('click', function(){ if (key !== currentPath) navigate(key); });
      winBreadcrumb.appendChild(btn);
    });
  }

  function updateSidebarActive(path){
    var branch = rootBranch(path);
    sidebarNavItems.forEach(function(item){
      item.classList.toggle('active', item.getAttribute('data-path') === branch);
    });
  }

  function renderCurrentFolder(){
    if (!winContent) return;
    var node = FS[currentPath];
    if (!node) return;
    winContent.innerHTML = '';
    if (winTitle) winTitle.textContent = node.name;
    if (winSearchInput) winSearchInput.value = '';
    renderBreadcrumb(currentPath);
    updateSidebarActive(currentPath);
    if (winBackBtn) winBackBtn.disabled = navHistory.length === 0;

    if (node.children.length){
      renderFolderTiles(winContent, node.children);
    } else if (node.custom === 'apps'){
      renderAppsView(winContent, node.appNames);
    } else if (node.custom === 'photos'){
      renderPicturesView(winContent);
    } else if (node.custom === 'docs'){
      renderDocumentsView(winContent);
    } else {
      renderEmptyView(winContent, node.name);
    }
  }

  function navigate(path){
    if (!FS[path] || path === currentPath) return;
    navHistory.push(currentPath);
    currentPath = path;
    renderCurrentFolder();
  }
  function navigateBack(){
    if (!navHistory.length) return;
    currentPath = navHistory.pop();
    renderCurrentFolder();
  }

  function filterCurrentView(query){
    if (!winContent) return;
    var q = query.trim().toLowerCase();
    var tiles = Array.prototype.slice.call(winContent.querySelectorAll('.win-file'));
    var anyVisible = false;
    tiles.forEach(function(tile){
      var match = !q || (tile.getAttribute('data-search-name') || '').indexOf(q) !== -1;
      tile.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    var existingEmpty = winContent.querySelector('.win-empty');
    if (existingEmpty) existingEmpty.remove();
    if (!anyVisible && tiles.length){
      var e = document.createElement('div');
      e.className = 'win-empty';
      e.textContent = 'No matches for "' + query.trim() + '".';
      winContent.appendChild(e);
    }
  }

  if (winBackBtn) winBackBtn.addEventListener('click', navigateBack);
  if (winSearchInput) winSearchInput.addEventListener('input', function(){ filterCurrentView(winSearchInput.value); });
  sidebarNavItems.forEach(function(nav){
    nav.addEventListener('click', function(){
      var path = nav.getAttribute('data-path');
      if (path) navigate(path);
    });
  });

  var filesChrome = winFiles ? wireWindowChrome(winFiles, {
    width: 640, height: 430,
    onShow: function(){ setTaskbarIcon('files', FOLDER_SVG, 'This PC', function(){
      if (winFiles.hidden) showFilesWindow(); else minimizeFilesWindow();
    }); },
    onMinimize: function(){ /* icon stays pinned while "running" */ },
    onClose: function(){ clearTaskbarIcon('files'); }
  }) : null;

  function openFilesWindow(){
    if (!filesChrome) return;
    var wasHidden = winFiles.hidden;
    filesChrome.show();
    if (wasHidden){ currentPath = 'thispc'; navHistory = []; renderCurrentFolder(); }
    closeStartMenu();
  }
  function showFilesWindow(){ if (filesChrome) filesChrome.show(false); }
  function minimizeFilesWindow(){ if (filesChrome) filesChrome.minimize(); }
  function closeFilesWindow(){ if (filesChrome) filesChrome.close(); }

  // Direct shortcuts (Photos, Games, Security, Tools) always jump straight
  // to that folder, unlike the plain Files launcher which reopens wherever
  // it was left.
  function openFilesAt(path){
    if (!filesChrome || !FS[path]) return;
    filesChrome.show();
    currentPath = path;
    navHistory = fsChain(path).slice(0, -1);
    renderCurrentFolder();
    closeStartMenu();
  }
  function openPhotosWindow(){ openFilesAt('pictures'); }

  // ── Photo viewer window (reused for whichever photo was last opened) ──
  var winViewer = document.getElementById('win-viewer');
  var viewerImg = document.getElementById('viewer-img');
  var viewerTitle = document.getElementById('win-viewer-title');

  var viewerChrome = winViewer ? wireWindowChrome(winViewer, {
    width: 620, height: 460, offset: 60,
    onShow: function(){ setTaskbarIcon('viewer', PHOTOS_SVG, viewerTitle ? viewerTitle.textContent : 'Photo', function(){
      if (winViewer.hidden) viewerChrome.show(false); else viewerChrome.minimize();
    }); },
    onClose: function(){ clearTaskbarIcon('viewer'); }
  }) : null;

  // Cycling reads off the same PHOTOS list the Pictures folder renders, so
  // arrows always match whatever's actually visible there.
  function viewerPhotos(){ return PHOTOS.filter(function(p){ return p.src; }); }
  var viewerIndex = -1;

  function showViewerAt(idx){
    var list = viewerPhotos();
    if (!list.length) return;
    viewerIndex = ((idx % list.length) + list.length) % list.length;
    var photo = list[viewerIndex];
    if (viewerImg) viewerImg.src = photo.src;
    if (viewerTitle) viewerTitle.textContent = photo.name + '.' + photo.ext;
    clearTaskbarIcon('viewer');
    setTaskbarIcon('viewer', PHOTOS_SVG, photo.name, function(){
      if (winViewer.hidden) viewerChrome.show(false); else viewerChrome.minimize();
    });
  }
  function viewerPrev(){ showViewerAt(viewerIndex - 1); }
  function viewerNext(){ showViewerAt(viewerIndex + 1); }

  function openViewer(photo){
    if (!viewerChrome) return;
    var idx = viewerPhotos().indexOf(photo);
    viewerChrome.show();
    showViewerAt(idx !== -1 ? idx : 0);
  }

  var viewerPrevBtn = document.getElementById('viewer-prev');
  var viewerNextBtn = document.getElementById('viewer-next');
  if (viewerPrevBtn) viewerPrevBtn.addEventListener('click', viewerPrev);
  if (viewerNextBtn) viewerNextBtn.addEventListener('click', viewerNext);

  document.addEventListener('keydown', function(e){
    if (!winViewer || winViewer.hidden) return;
    if (e.key === 'ArrowLeft'){ e.preventDefault(); viewerPrev(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); viewerNext(); }
  });

  // ── Doc viewer window (read-me style cards — Documents files and the
  // "what is this" popup on an in-dev desktop icon both open through here) ──
  var winDoc = document.getElementById('win-doc');
  var winDocTitle = document.getElementById('win-doc-title');
  var docLogo = document.getElementById('doc-logo');
  var docCardTitle = document.getElementById('doc-card-title');
  var docCardStatus = document.getElementById('doc-card-status');
  var docCardBody = document.getElementById('doc-card-body');

  var docChrome = winDoc ? wireWindowChrome(winDoc, {
    width: 460, height: 420,
    onShow: function(){ setTaskbarIcon('doc', DOC_SVG, winDocTitle ? winDocTitle.textContent : 'Document', function(){
      if (winDoc.hidden) docChrome.show(false); else docChrome.minimize();
    }); },
    onClose: function(){ clearTaskbarIcon('doc'); }
  }) : null;

  function openDoc(doc){
    if (!docChrome) return;
    if (winDocTitle) winDocTitle.textContent = doc.name + '.' + doc.ext;
    if (docLogo) docLogo.src = doc.logo || '';
    if (docCardTitle) docCardTitle.textContent = doc.title;
    if (docCardStatus) docCardStatus.textContent = doc.status;
    if (docCardBody){
      docCardBody.innerHTML = '';
      doc.body.forEach(function(paragraph){
        var p = document.createElement('p');
        p.textContent = paragraph;
        docCardBody.appendChild(p);
      });
    }
    docChrome.show();
    clearTaskbarIcon('doc');
    setTaskbarIcon('doc', DOC_SVG, doc.name, function(){
      if (winDoc.hidden) docChrome.show(false); else docChrome.minimize();
    });
  }

  // ── Power — quick blackout/fade-back-in placeholder, no menu yet ──────
  var powerFlash = document.createElement('div');
  powerFlash.className = 'power-flash';
  document.body.appendChild(powerFlash);

  function playPowerCycle(){
    powerFlash.classList.add('active');
    setTimeout(function(){ powerFlash.classList.remove('active'); }, 650);
  }

  // ── Embedded-site window (reused for whichever live project was last
  // opened — same one-window pattern as the photo viewer and doc reader) ──
  // GitHub Pages sends no X-Frame-Options / CSP frame-ancestors header and
  // has no way to add one, so both of these are embeddable from anywhere.
  var winIframe = document.getElementById('win-iframe');
  var winIframeTitle = document.getElementById('win-iframe-title');
  var siteIframe = document.getElementById('site-iframe');
  var iframeLoading = document.getElementById('iframe-loading');
  var iframeOpenBtn = document.getElementById('win-iframe-open');
  var currentSiteUrl = '';

  var SITES = {
    'TNFC': { url: 'https://tnfloorcovering.github.io/index.html', title: 'TNFC' },
    'BAD MODS': { url: 'https://bad-mods.github.io/BadMods/#homeTop', title: 'BAD MODS' }
  };

  var iframeChrome = winIframe ? wireWindowChrome(winIframe, {
    width: 900, height: 560,
    onShow: function(){ setTaskbarIcon('iframe', GLOBE_SVG, winIframeTitle ? winIframeTitle.textContent : 'Site', function(){
      if (winIframe.hidden) iframeChrome.show(false); else iframeChrome.minimize();
    }); },
    onClose: function(){
      clearTaskbarIcon('iframe');
      if (siteIframe) siteIframe.src = 'about:blank'; // stop the embedded page once closed
    }
  }) : null;

  function openSite(name){
    var site = SITES[name];
    if (!site || !iframeChrome) return;
    currentSiteUrl = site.url;
    if (winIframeTitle) winIframeTitle.textContent = site.title;
    if (iframeLoading) iframeLoading.classList.remove('hidden');
    if (siteIframe) siteIframe.src = site.url;
    iframeChrome.show();
    clearTaskbarIcon('iframe');
    setTaskbarIcon('iframe', GLOBE_SVG, site.title, function(){
      if (winIframe.hidden) iframeChrome.show(false); else iframeChrome.minimize();
    });
  }
  if (siteIframe) siteIframe.addEventListener('load', function(){
    if (iframeLoading) iframeLoading.classList.add('hidden');
  });
  if (iframeOpenBtn) iframeOpenBtn.addEventListener('click', function(){
    if (currentSiteUrl) window.open(currentSiteUrl, '_blank', 'noopener');
  });

  // ── Volume popup ─────────────────────────────────────────────
  var volumeBtn = document.getElementById('volume-btn');
  var volumePopup = document.getElementById('volume-popup');
  var volMuteBtn = document.getElementById('vol-mute-btn');
  var volSlider = document.getElementById('vol-slider');
  var volPct = document.getElementById('vol-pct');
  var volState = { level: 80, muted: false };
  var volIconOn = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
  var volIconOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';

  function applyVolumeToWindows(){
    // Controls native <video>/<audio> the shell itself renders inside a
    // .window. A future embedded site running in its own iframe is on a
    // different origin and can't be reached from out here directly — that
    // will need its own postMessage bridge once we wire iframes in.
    var level = volState.muted ? 0 : volState.level;
    var media = document.querySelectorAll('.window video, .window audio');
    media.forEach(function(m){ m.volume = level / 100; m.muted = volState.muted; });
  }
  function updateVolumeUI(){
    if (volSlider) volSlider.value = String(volState.level);
    if (volPct) volPct.textContent = (volState.muted ? 0 : volState.level) + '%';
    if (volumePopup) volumePopup.classList.toggle('is-muted', volState.muted);
    if (volMuteBtn) volMuteBtn.innerHTML = volState.muted ? volIconOff : volIconOn;
  }
  function openVolumePopup(){
    closeAllPopups('volume');
    if (volumePopup) volumePopup.classList.add('open');
    if (volumeBtn) volumeBtn.classList.add('is-active');
  }
  function closeVolumePopup(){
    if (volumePopup) volumePopup.classList.remove('open');
    if (volumeBtn) volumeBtn.classList.remove('is-active');
  }
  if (volumeBtn) volumeBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (volumePopup && volumePopup.classList.contains('open')) closeVolumePopup();
    else openVolumePopup();
  });
  if (volSlider) volSlider.addEventListener('input', function(){
    volState.level = parseInt(volSlider.value, 10) || 0;
    if (volState.level > 0) volState.muted = false;
    updateVolumeUI();
    applyVolumeToWindows();
  });
  if (volMuteBtn) volMuteBtn.addEventListener('click', function(){
    volState.muted = !volState.muted;
    updateVolumeUI();
    applyVolumeToWindows();
  });
  updateVolumeUI();

  // ── Calendar popup ───────────────────────────────────────────
  var clockBtn = document.getElementById('clock-btn');
  var calPopup = document.getElementById('cal-popup');
  var calTitle = document.getElementById('cal-title');
  var calGrid = document.getElementById('cal-grid');
  var calPrev = document.getElementById('cal-prev');
  var calNext = document.getElementById('cal-next');
  var calViewDate = new Date();
  calViewDate.setDate(1);
  var DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function renderCalendar(){
    if (!calGrid || !calTitle) return;
    var year = calViewDate.getFullYear();
    var month = calViewDate.getMonth();
    calTitle.textContent = MONTHS[month] + ' ' + year;
    calGrid.innerHTML = '';
    DOW.forEach(function(d){
      var el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });
    var firstDow = new Date(year, month, 1).getDay();
    var start = new Date(year, month, 1 - firstDow);
    var today = new Date();
    for (var i = 0; i < 42; i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var cell = document.createElement('div');
      cell.className = 'cal-day';
      if (d.getMonth() !== month) cell.classList.add('outside');
      if (d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate()){
        cell.classList.add('today');
      }
      cell.textContent = String(d.getDate());
      calGrid.appendChild(cell);
    }
  }
  function openCalendar(){
    closeAllPopups('calendar');
    calViewDate = new Date();
    calViewDate.setDate(1);
    renderCalendar();
    if (calPopup) calPopup.classList.add('open');
    if (clockBtn) clockBtn.classList.add('is-open');
  }
  function closeCalendar(){
    if (calPopup) calPopup.classList.remove('open');
    if (clockBtn) clockBtn.classList.remove('is-open');
  }
  if (clockBtn) clockBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (calPopup && calPopup.classList.contains('open')) closeCalendar();
    else openCalendar();
  });
  if (calPrev) calPrev.addEventListener('click', function(){ calViewDate.setMonth(calViewDate.getMonth() - 1); renderCalendar(); });
  if (calNext) calNext.addEventListener('click', function(){ calViewDate.setMonth(calViewDate.getMonth() + 1); renderCalendar(); });

  // ── Shared popup coordination ────────────────────────────────
  function closeAllPopups(except){
    if (except !== 'start') closeStartMenu();
    if (except !== 'volume') closeVolumePopup();
    if (except !== 'calendar') closeCalendar();
  }

  try {
    if (window.claude && window.claude.hot){
      var snap = function(){ return { query: input ? input.value : '' }; };
      window.claude.hot.snapshot(snap);
      var boot = function(data){ if (input && data && data.query){ input.value = data.query; clearBtn.hidden = false; } };
      window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
    }
  } catch(e){}
})();
</script>
